server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers at the edge too - the backend sets its own on API
    # responses, but static assets are served entirely by nginx and never
    # touch the FastAPI process.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (js/css from Vite) are safe to cache aggressively -
    # a content change means a new filename, not a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real file goes to index.html so
    # client-side routing (React Router) handles it instead of nginx 404ing
    # on a direct visit/refresh of e.g. /nodes/abc123.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
